name: TW EMA20 Daily Scan

on:
  schedule:
    # 台灣時間 13:40（收盤後），UTC = 台灣時間 -8 小時 -> 05:40 UTC
    - cron: "40 5 * * 1-5"
  workflow_dispatch: {}

# 「提交更新後的資料庫」那個步驟要 git push tw_daily.db 回 repo，預設的
# GITHUB_TOKEN 是唯讀的（2026-10-16 實測：git push 被拒絕，403），
# 一定要這裡明確開寫入權限才行。
permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安裝套件
        run: pip install -r requirements.txt

      - name: 執行掃描並寄信
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python daily_scan.py

      # DB 需要跨天累積，這裡把更新後的 tw_daily.db 提交回 repo
      - name: 提交更新後的資料庫
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add tw_daily.db
          git diff --cached --quiet || git commit -m "更新每日收盤資料 $(date +%F)"
          git push
